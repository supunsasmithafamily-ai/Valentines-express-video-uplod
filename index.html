<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Hub & Player</title>
    
    <!-- HilltopAds Meta Verification -->
    <meta name="hilltopads-site-verification" content="HILLTOPADS_VERIFICATION_CODE_HERE" />

    <!-- Font Awesome Icons & Video.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/videojs-ima/1.11.0/videojs.ima.css" rel="stylesheet" />

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary-color: #6366f1;
            --accent-color: #ef4444;
            --text-color: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 15px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            padding: 20px 0;
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--primary-color);
        }

        /* Banner Ad Containers */
        .ad-banner {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed #334155;
            border-radius: 8px;
            overflow: hidden;
            min-height: 50px;
        }

        .ad-top { min-height: 90px; }
        .ad-middle { min-height: 250px; }
        .ad-bottom { min-height: 50px; }

        /* Video Player Wrapper */
        .player-container {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .video-js {
            width: 100%;
            height: auto;
            aspect-ratio: 16/9;
        }

        /* Action Direct Link Button */
        .action-btn-container {
            text-align: center;
            margin: 15px 0;
        }

        .direct-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            transition: transform 0.2s, background 0.2s;
        }

        .direct-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #dc2626, #b91c1c);
        }

        /* Admin Upload Section */
        .admin-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
            border: 1px solid #334155;
        }

        .admin-section h3 {
            margin-top: 0;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }

        .btn-submit {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-play-circle"></i> Video Hub</h1>
        </header>

        <!-- Top Banner Ad (728x90 or 320x50 Mobile) -->
        <div class="ad-banner ad-top" id="top-ad">
            <!-- Paste Top Banner Code Here -->
        </div>

        <!-- Direct Link Download / Stream CTA Button -->
        <div class="action-btn-container">
            <a href="https://11745.xml.4armn.com/direct-link-v2?pubid=995748&siteid=406408&linkid=115741" 
               target="_blank" 
               class="direct-btn">
                <i class="fa-solid fa-download"></i> Stream / Fast Download HD
            </a>
        </div>

        <!-- Video Player Section -->
        <div class="player-container">
            <video id="content_video" class="video-js vjs-default-skin" controls preload="auto" poster="https://via.placeholder.com/800x450?text=Loading+Video">
                <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4" />
            </video>
        </div>

        <!-- Middle Banner Ad (300x250 Box) -->
        <div class="ad-banner ad-middle" id="middle-ad">
            <!-- Paste Middle Banner Code Here -->
        </div>

        <!-- Bottom Banner Ad (320x50) -->
        <div class="ad-banner ad-bottom" id="bottom-ad">
            <!-- Paste Bottom Banner Code Here -->
        </div>

        <!-- Admin Video Upload Panel -->
        <div class="admin-section">
            <h3><i class="fa-solid fa-lock"></i> Admin Upload Panel</h3>
            <form id="uploadForm">
                <div class="form-group">
                    <label>Video Title</label>
                    <input type="text" id="videoTitle" placeholder="Enter video title" required>
                </div>
                <div class="form-group">
                    <label>Video Direct URL (.mp4 / .m3u8)</label>
                    <input type="url" id="videoUrl" placeholder="https://domain.com/video.mp4" required>
                </div>
                <div class="form-group">
                    <label>Admin Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-submit">Publish Video</button>
            </form>
        </div>
    </div>

    <!-- Video.js and Google IMA SDK for VAST Video Ads -->
    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script src="https://imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-ima/1.11.0/videojs.ima.min.js"></script>

    <script>
        // 1. Popunder Direct Link Trigger on First Screen Click
        document.addEventListener('click', function triggerDirectLink() {
            // RichAds Mainstream Direct Link
            const directUrl = "https://11745.xml.4armn.com/direct-link-v2?pubid=995748&siteid=406408&linkid=115741";
            window.open(directUrl, '_blank');
            document.removeEventListener('click', triggerDirectLink);
        }, { once: true });

        // 2. Dynamic User IP & User-Agent Fetch for RichAds VAST Ad Tag
        let userIp = "";
        let userAgent = encodeURIComponent(navigator.userAgent);

        // Fetch Client IP
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => { userIp = data.ip; initializePlayer(); })
            .catch(() => { initializePlayer(); });

        function initializePlayer() {
            // Alternating VAST Video Ad Tags (RichAds vs HilltopAds)
            const richAdsVast = `https://11745.xml.4armn.com/vast-v2?pubid=995748&siteid=406408&iip=${userIp}&iua=${userAgent}`;
            const hilltopAdsVast = "https://hilltopads.com/vast_tag_example_url"; // Replace with your HilltopAds VAST Tag URL

            // Select VAST Tag dynamically (Alternating logic using LocalStorage)
            let currentAdIndex = localStorage.getItem('ad_toggle') || 0;
            let selectedVastTag = (currentAdIndex % 2 === 0) ? richAdsVast : hilltopAdsVast;
            localStorage.setItem('ad_toggle', parseInt(currentAdIndex) + 1);

            // Initialize Video.js Player
            var player = videojs('content_video');

            var imaOptions = {
                id: 'content_video',
                adTagUrl: selectedVastTag,
                preventNonStart: true,
                nonSkippable: true // Non-skippable 5 sec Video Ad
            };

            player.ima(imaOptions);

            // Auto-play ad on initial user interaction
            var startEvent = 'touchstart';
            if ((navigator.userAgent.match(/iPad/i) ||
                 navigator.userAgent.match(/iPhone/i) ||
                 navigator.userAgent.match(/Android/i))) {
                startEvent = 'touchend';
            }
            
            player.one(startEvent, function() {
                player.ima.initializeAdDisplayContainer();
            });
        }

        // 3. Admin Panel Upload Security Handler
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('adminPassword').value;
            const title = document.getElementById('videoTitle').value;
            const url = document.getElementById('videoUrl').value;

            // Admin Security Password Verification
            if (password === 'Ysk1997@10') {
                alert('Success: Video published successfully!\nTitle: ' + title);
                // Here Firebase Database push function can be integrated
                document.getElementById('uploadForm').reset();
            } else {
                alert('Error: Incorrect Admin Password!');
            }
        });
    </script>
</body>
</html>
