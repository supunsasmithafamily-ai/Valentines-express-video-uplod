<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velantin Express Video Player</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(23, 32, 54, 0.7);
            --border-color: rgba(255, 255, 255, 0.12);
            --primary-glow: #6366f1;
            --text-color: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 850px; }

        .app-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 1.8rem;
            text-align: center;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .input-group { margin-bottom: 15px; }

        input, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            outline: none;
            margin-bottom: 10px;
        }

        textarea { height: 70px; resize: none; }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-submit:hover { transform: translateY(-2px); }

        .video-grid { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }

        .video-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 15px;
            overflow: hidden;
        }

        .video-title { font-weight: 600; margin-bottom: 10px; color: #818cf8; }

        .player-frame {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .player-frame iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }

        .ad-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 100; display: none;
            flex-direction: column; justify-content: center; align-items: center;
        }

        .skip-btn {
            position: absolute; bottom: 15px; right: 15px;
            background: rgba(255, 255, 255, 0.2); border: 1px solid #fff;
            color: white; padding: 6px 14px; border-radius: 6px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="app-card">
            <h1><i class="fa-solid fa-cloud-arrow-up"></i> Velantin Video Hub</h1>
            <div class="input-group">
                <input type="text" id="videoTitle" placeholder="වීඩියෝ එකේ මාතෘකාව (Title)...">
                <textarea id="embedInput" placeholder="Embed Code එක Paste කරන්න (<iframe...>)"></textarea>
                <button class="btn-submit" onclick="saveVideo()"><i class="fa-solid fa-plus"></i> Save Video to Firebase</button>
            </div>
        </div>

        <h2 style="font-size: 1.2rem; color: #94a3b8; margin-bottom: 10px;">Uploaded Videos Feed</h2>
        <div id="videoFeed" class="video-grid"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ඔබේ Firebase Configuration එක
        const firebaseConfig = {
            apiKey: "AIzaSyB8NfN5HNygj_U4sROFeiHmp9cPGeYQAw0",
            authDomain: "velantin-express-video-uplod.firebaseapp.com",
            projectId: "velantin-express-video-uplod",
            storageBucket: "velantin-express-video-uplod.firebasestorage.app",
            messagingSenderId: "1067729990043",
            appId: "1:1067729990043:web:204550c4792e16c5b4313e",
            measurementId: "G-E1T45T40VX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // HilltopAds VAST Tag URL එක මෙතනට Paste කරන්න
        const HILLTOP_VAST_TAG_URL = "YOUR_HILLTOPADS_VAST_TAG_URL_HERE";

        // Firestore වෙත වීඩියෝ සේව් කිරීම
        window.saveVideo = async function() {
            const title = document.getElementById('videoTitle').value.trim();
            const embed = document.getElementById('embedInput').value.trim();

            if (!title || !embed) {
                alert("කරුණාකර මාතෘකාව සහ Embed Code එක ඇතුළත් කරන්න!");
                return;
            }

            try {
                await addDoc(collection(db, "videos"), {
                    title: title,
                    embed: embed,
                    createdAt: new Date()
                });
                alert("වීඩියෝ එක Firebase Database එකට Save විය!");
                document.getElementById('videoTitle').value = '';
                document.getElementById('embedInput').value = '';
                fetchVideos();
            } catch (e) {
                console.error("Error adding document: ", e);
                alert("Save කිරීමේදී දෝෂයක් සිදු විය. Firebase Rules පරීක්ෂා කරන්න.");
            }
        };

        // Firestore එකෙන් Videos ලබාගැනීම
        async function fetchVideos() {
            const videoFeed = document.getElementById('videoFeed');
            videoFeed.innerHTML = '';

            try {
                const q = query(collection(db, "videos"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML = `
                        <div class="video-title">${data.title}</div>
                        <div class="player-frame">
                            ${data.embed}
                        </div>
                    `;
                    videoFeed.appendChild(card);
                });
            } catch (e) {
                console.error("Error fetching documents: ", e);
            }
        }

        // පිටුව Load වන විට Videos පෙන්වීම
        fetchVideos();
    </script>
</body>
</html>
