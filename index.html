    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(23, 32, 54, 0.7);
            --border-color: rgba(255, 255, 255, 0.12);
            --text-color: #f8fafc;

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 850px; }

        /* General Ad Slot Base Styling */
        .ad-slot {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px auto;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.5);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            color: #64748b;
            font-size: 0.85rem;
        }

        /* 1. TOP BANNER AD SLOT (728x90) */
        #top-ad { width: 100%; max-width: 728px; height: 90px; }

        /* 2. MIDDLE BANNER AD SLOT (300x250 Box) */
        #middle-ad { width: 300px; height: 250px; }

        /* 3. BOTTOM BANNER AD SLOT (320x50 Mobile) */
        #bottom-ad { width: 100%; max-width: 320px; height: 50px; }

        @media (max-width: 768px) {
            #top-ad { max-width: 320px; height: 50px; }
        }

        .action-btn-container { text-align: center; margin: 15px 0; }
        .direct-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            transition: transform 0.2s;
        }
        .direct-btn:hover { transform: translateY(-2px); }

        .app-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 1.8rem;
            text-align: center;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            outline: none;
            margin-bottom: 10px;
        }

        textarea { height: 90px; resize: none; }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .video-grid { display: flex; flex-direction: column; gap: 20px; margin-top: 15px; }

        .video-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 15px;
            overflow: hidden;
        }

        .player-frame {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .player-frame iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }

        /* Non-Skippable Overlay UI */
        .ad-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .ad-status {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(99, 102, 241, 0.8);
            color: white;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Admin Upload Panel (Only Embed Code & Password) -->

                <button class="btn-submit" id="saveBtn"><i class="fa-solid fa-cloud-arrow-up"></i> Publish Video</button>
            </div>
        </div>

        <!-- MIDDLE BANNER AD SLOT -->
        <div class="ad-slot" id="middle-ad">

var d = document,

s.settings = nojbnd || {};

s.async = true;
s.referrerPolicy = 'no-referrer-when-downgrade';

            </script> ]</span>

        <h2 style="font-size: 1.2rem; color: #94a3b8; margin-bottom: 10px;">Uploaded Videos</h2>
        <div id="videoFeed" class="video-grid"></div>

        <!-- BOTTOM BANNER AD SLOT -->

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB8NfN5HNygj_U4sROFeiHmp9cPGeYQAw0",
            authDomain: "velantin-express-video-uplod.firebaseapp.com",
            projectId: "velantin-express-video-uplod",
            storageBucket: "velantin-express-video-uplod.firebasestorage.app",
            messagingSenderId: "1067729990043",
            appId: "1:1067729990043:web:204550c4792e16c5b4313e",
            measurementId: "G-E1T45T40VX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Direct Links List (3 Links)
        const directLinks = [
            "https://11745.xml.4armn.com/direct-link-v2?pubid=995748&siteid=406408&linkid=115741",
            "https://unfolded-uncle.com/d.mxFhzKdVGrNEvEZgGgUg/eeImW9PutZbUDlikXPoTacrzTOCDKQZ0ONvD/UTtkNDzbMN4_NcDJQJ0NOsQk",
            "https://11745.xml.4armn.com/direct-link-v2?pubid=995748&siteid=406408&linkid=115741"
        ];

        // Direct Link Smart Frequency Manager (3 Clicks -> 30 Min Cooldown)
        document.addEventListener('click', function handlePopunderClicks() {
            const lastCooldownTime = localStorage.getItem('ad_cooldown_time');
            const currentTime = new Date().getTime();
            const cooldownDuration = 30 * 60 * 1000; // මිනිත්තු 30 (30 Mins in ms)

            // පැය භාගයේ Cooldown එක ඉවර වී ඇත්නම් Counter එක Reset කරන්න
            if (lastCooldownTime && (currentTime - lastCooldownTime > cooldownDuration)) {
                localStorage.removeItem('ad_cooldown_time');
                localStorage.setItem('ad_click_count', '0');
            }

            // Cooldown එකේ පවතිනවා නම් Ad Open නොකරන්න
            if (localStorage.getItem('ad_cooldown_time')) {
                return;
            }

            let clickCount = parseInt(localStorage.getItem('ad_click_count') || '0');

            if (clickCount < 3) {
                // අදාළ Direct Link එක Open කිරීම
                window.open(directLinks[clickCount], '_blank');
                
                clickCount++;
                localStorage.setItem('ad_click_count', clickCount.toString());

                // Click 3 සපිරුණු පසු පැය භාගයක Cooldown එකක් සක්‍රීය කරන්න
                if (clickCount >= 3) {
                    localStorage.setItem('ad_cooldown_time', currentTime.toString());
                }
            }
        });

        // VAST Tag URLs
        const HILLTOP_VAST_URL = "https://unfolded-uncle.com/d.mxFhzKdVGrNEvEZgGgUg/eeImW9PutZbUDlikXPoTacrzTOCDKQZ0ONvD/UTtkNDzbMN4_NcDJQJ0NOsQk";
        const RICHADS_VAST_TEMPLATE = "http://16793.rtb.adp3.net/pre-roll-rp?pubid=995748&siteid=406408&ip=[IP]&ua=[USER_AGENT]";

        let userIP = "";

        // User IP Fetching
        async function fetchUserIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                userIP = data.ip;
            } catch (err) {
                console.log("Using default fallback IP");
            }
        }
        fetchUserIP();

        function getRichAdsUrl() {
            const ua = encodeURIComponent(navigator.userAgent);
            const ip = encodeURIComponent(userIP || '127.0.0.1');
            return RICHADS_VAST_TEMPLATE.replace('[IP]', ip).replace('[USER_AGENT]', ua);
        }

        const saveBtn = document.getElementById('saveBtn');
        const videoFeed = document.getElementById('videoFeed');

        // Video Upload Handler
        saveBtn.addEventListener('click', async () => {
            const pass = document.getElementById('adminPass').value.trim();
            const embed = document.getElementById('embedInput').value.trim();

            if (!pass || !embed) {
                alert("කරුණාකර Password සහ Embed Code එක ඇතුළත් කරන්න!");
                return;
            }

            saveBtn.innerText = "Publishing...";
            saveBtn.disabled = true;

            try {
                await addDoc(collection(db, "videos"), {
                    embed: embed,
                    passKey: pass,
                    timestamp: Date.now()
                });

                alert("වීඩියෝ එක සාර්ථකව Publish විය!");
                document.getElementById('embedInput').value = '';
                fetchVideos();
            } catch (error) {
                alert("Upload කිරීමට අවසර නැත! (Security Password එක වැරදියි)");
            } finally {
                saveBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Publish Video';
                saveBtn.disabled = false;
            }
        });

        // Videos Real-time Load Function
        async function fetchVideos() {
            videoFeed.innerHTML = '<p style="color:#aaa; text-align:center;">Loading videos...</p>';

            try {
                const querySnapshot = await getDocs(collection(db, "videos"));
                videoFeed.innerHTML = '';

                if (querySnapshot.empty) {
                    videoFeed.innerHTML = '<p style="color:#aaa; text-align:center;">තවම වීඩියෝ කිසිවක් නොමැත.</p>';
                    return;
                }

                let docsArray = [];
                querySnapshot.forEach((doc) => {
                    docsArray.push({ id: doc.id, ...doc.data() });
                });

                docsArray.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                docsArray.forEach((data, index) => {
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    
                    const adOverlayId = `ad-overlay-${index}`;
                    const adIframeId = `ad-iframe-${index}`;

                    card.innerHTML = `
                        <div class="player-frame">
                            ${data.embed}
                            <div class="ad-overlay" id="${adOverlayId}">
                                <div class="ad-status"><i class="fa-solid fa-rectangle-ad"></i> Advertisement (Please wait...)</div>
                                <div id="${adIframeId}" style="width:100%; height:100%;"></div>
                            </div>
                        </div>
                    `;
                    videoFeed.appendChild(card);

                    // Ad Display Trigger (After 5 Secs)
                    setTimeout(() => {
                        triggerNonSkippableAd(adOverlayId, adIframeId, index);
                    }, 5000);
                });
            } catch (error) {
                videoFeed.innerHTML = '<p style="color:#ef4444; text-align:center;">Videos load කිරීමට නොහැකි විය.</p>';
            }
        }

        function triggerNonSkippableAd(overlayId, iframeContainerId, index) {
            const overlay = document.getElementById(overlayId);
            const container = document.getElementById(iframeContainerId);

            if (overlay && container) {
                overlay.style.display = 'flex';
                
                const selectedVastUrl = (index % 2 === 0) ? getRichAdsUrl() : HILLTOP_VAST_URL;
                
                // Autoplay permissions සහ Mute attributes එකතු කර ඇත
                container.innerHTML = `
                    <iframe 
                        src="${selectedVastUrl}" 
                        width="100%" 
                        height="100%" 
                        frameborder="0" 
                        scrolling="no" 
                        allow="autoplay *; fullscreen *; encrypted-media *"
                        allowfullscreen>
                    </iframe>`;

                // තත්පර 10කට පසු Ad එක Hide කිරීම
                setTimeout(() => {
                    overlay.style.display = 'none';
                    container.innerHTML = '';
                }, 10000);
            }
        }

        fetchVideos();
    </script>
</body>
